# Yerel test Postgres'i (Docker'li makinelerde). Docker yoksa testler `pgserver` ile gomulu Postgres kullanir.
#   docker compose -f docker-compose.test.yml up -d
#   BIST_TEST_ADMIN_URL=postgresql://postgres:test@127.0.0.1:54329/postgres pytest
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: test   # yalnizca yerel, atilabilir test veritabani
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
